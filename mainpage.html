<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">
  <div class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-xl p-8 shadow-2xl">
    <h1 class="text-2xl font-bold mb-2 text-white">Select a Form Template</h1>
    <p class="text-slate-400 mb-6 text-sm">Select a document template to edit, fill out, and export.</p>
    
    <div class="space-y-4">
      <!-- Template Option 1 -->
      <a href="form/code/editor.html?file=blabla.docx" class="flex items-center justify-between bg-slate-700 hover:bg-slate-600 p-4 rounded-lg border border-slate-600 transition group">
        <div>
          <h2 class="font-semibold text-white group-hover:text-blue-400 transition">Template Form 1</h2>
          <p class="text-xs text-slate-400">form/blabla.docx</p>
        </div>
        <span class="bg-blue-600 group-hover:bg-blue-500 text-xs px-3 py-1.5 rounded text-white font-medium transition">Open Editor &rarr;</span>
      </a>

      <!-- Template Option 2 -->
      <a href="form/code/editor.html?file=wewe.docx" class="flex items-center justify-between bg-slate-700 hover:bg-slate-600 p-4 rounded-lg border border-slate-600 transition group">
        <div>
          <h2 class="font-semibold text-white group-hover:text-blue-400 transition">Template Form 2</h2>
          <p class="text-xs text-slate-400">form/wewe.docx</p>
        </div>
        <span class="bg-blue-600 group-hover:bg-blue-500 text-xs px-3 py-1.5 rounded text-white font-medium transition">Open Editor &rarr;</span>
      </a>
    </div>
  </div>
</body>
</html>
